# My Teacher IA - backend FastAPI
# Preparacion inicial: NO equivale a despliegue.
services:
  - type: web
    name: my-teacher-ia-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: CONAUTI_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_OTP_PEPPER
        sync: false
