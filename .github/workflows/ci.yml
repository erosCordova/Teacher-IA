name: CONAUTI - Integracion continua

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q tests
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:conauti
        working-directory: frontend


  study-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teacher_ci
          POSTGRES_PASSWORD: teacher_ci
          POSTGRES_DB: teacher_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teacher_ci -d teacher_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONAUTI_TEST_DATABASE_URL: postgresql://teacher_ci:teacher_ci@127.0.0.1:5432/teacher_ci
      CONAUTI_DATABASE_URL: postgresql://teacher_ci:teacher_ci@127.0.0.1:5432/teacher_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Validar tarjetas, exámenes, RAG y aislamiento por estudiante
        run: python -m pytest -q tests/test_conauti_study_db_integration.py tests/test_conauti_offline_sync.py
        working-directory: backend
