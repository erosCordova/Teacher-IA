name: My Teacher IA - Firmar AAB Android manualmente

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myteacher-release-signing
  cancel-in-progress: false

jobs:
  firma:
    name: Compilar y firmar AAB con clave privada protegida
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: android-release
    env:
      ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Exigir cuatro secretos de la clave de subida
        run: |
          if [[ -z "$ANDROID_UPLOAD_KEYSTORE_B64" || -z "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" || -z "$ANDROID_UPLOAD_KEY_ALIAS" || -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]]; then
            echo 'No se ha configurado la clave privada de subida en el entorno android-release.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar interfaz educativa
        working-directory: frontend
        run: |
          npm ci
          npm run build:conauti
      - name: Generar Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run mobile:check
          npm run android:init
          npm run android:sync
      - name: Incorporar plugins nativos
        run: |
          JAVA_DIR=mobile/android/app/src/main/java/pe/myteacheria/alumno
          mkdir -p "$JAVA_DIR"
          cp mobile/native/android/{MainActivity,SesionSeguraPlugin,ModeloEducativoPlugin,MotorLocalPlugin,HistorialLocalPlugin,VozLocalPlugin}.java "$JAVA_DIR/"
          bash mobile/scripts/preparar_motor_android.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Construir paquete sin firma y auditar seguridad
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          cd ../..
          python3 mobile/scripts/auditar_release_android.py
      - name: Firmar AAB con clave de subida privada y verificar firma
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp -p "$RUNNER_TEMP" myteacher-XXXXXX.jks)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEY_FILE"
          test -s "$KEY_FILE"
          mkdir -p mobile/release
          jarsigner -keystore "$KEY_FILE" \
            -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_UPLOAD_KEY_PASSWORD \
            -signedjar mobile/release/my-teacher-ia-firmado.aab \
            mobile/android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_UPLOAD_KEY_ALIAS"
          jarsigner -verify -strict mobile/release/my-teacher-ia-firmado.aab
          test -s mobile/release/my-teacher-ia-firmado.aab

          # APK independiente para descarga por navegador: alinear ANTES de firmar.
          # apksigner v2/v3 protege los bytes de todo el archivo instalado.
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS" && test -x "$BUILD_TOOLS"
          BUILD_TOOLS="$(dirname "$BUILD_TOOLS")"
          test -x "$BUILD_TOOLS/zipalign"
          test -s mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 \
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/myteacher-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEY_FILE" \
            --ks-key-alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            --ks-pass env:ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_UPLOAD_KEY_PASSWORD \
            --out mobile/release/my-teacher-ia-release.apk \
            "$RUNNER_TEMP/myteacher-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            mobile/release/my-teacher-ia-release.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 mobile/release/my-teacher-ia-release.apk
          test -s mobile/release/my-teacher-ia-release.apk

          # No exponer nunca la clave ni contraseñas en artefactos o registros.
          (cd mobile/release && sha256sum my-teacher-ia-firmado.aab my-teacher-ia-release.apk > SHA256SUMS.txt)
          echo 'AAB y APK firmados y verificados; publicación y distribución siguen siendo manuales.'
      - name: Conservar paquetes firmados privados durante 3 días
        uses: actions/upload-artifact@v4
        with:
          name: my-teacher-ia-android-publicacion-firmada
          path: |
            mobile/release/my-teacher-ia-firmado.aab
            mobile/release/my-teacher-ia-release.apk
            mobile/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
