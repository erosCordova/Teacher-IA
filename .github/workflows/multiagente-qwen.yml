name: CONAUTI - Modelo abierto real
on:
  push:
    branches:
      - 'codex/multiagente-qwen-*'
  workflow_dispatch:

jobs:
  qwen-en-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      ollama:
        image: ollama/ollama:0.40.16
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Descargar Qwen3 0.6B para una prueba temporal
        run: docker exec ${{ job.services.ollama.id }} ollama pull qwen3:0.6b
      - name: Probar agentes con inferencia real
        working-directory: backend
        env:
          AI_PROVIDER: ollama
          OLLAMA_ENABLED: 'true'
          OLLAMA_MODEL: qwen3:0.6b
          CONAUTI_LIVE_OLLAMA: 'true'
        run: python -m pytest -q tests/test_conauti_multi_agent_live.py

  voz-en-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Preparar audio sintético de prueba
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          espeak-ng -v es "Hola necesito ayuda con matemáticas" -w /tmp/conauti-audio.wav
      - name: Probar transcripción Whisper real
        working-directory: backend
        env:
          OPEN_ASR_ENABLED: 'true'
          OPEN_WHISPER_MODEL: base
          CONAUTI_LIVE_WHISPER: 'true'
          CONAUTI_TEST_AUDIO: /tmp/conauti-audio.wav
        run: python -m pytest -q tests/test_conauti_open_media_live.py

  imagen-en-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      ollama:
        image: ollama/ollama:0.40.16
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pillow
      - name: Descargar Qwen3-VL 2B para una prueba temporal
        run: docker exec ${{ job.services.ollama.id }} ollama pull qwen3-vl:2b-instruct
      - name: Probar visión real
        working-directory: backend
        env:
          AI_PROVIDER: ollama
          OLLAMA_ENABLED: 'true'
          OLLAMA_VISION_MODEL: qwen3-vl:2b-instruct
          CONAUTI_LIVE_VISION: 'true'
        run: python -m pytest -q tests/test_conauti_open_media_live.py

  voz-memoria-limitada:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.13-slim
      options: --memory=512m --cpus=1
    steps:
      - uses: actions/checkout@v4
      - name: Preparar audio sintético de prueba
        run: |
          apt-get update -qq
          apt-get install -y -qq espeak-ng
          espeak-ng -v es "Hola necesito ayuda con matemáticas" -w /tmp/conauti-audio.wav
      - run: python -m pip install -r backend/requirements.txt
      - name: Probar voz con límite de memoria
        working-directory: backend
        env:
          OPEN_ASR_ENABLED: 'true'
          OPEN_WHISPER_MODEL: base
          CONAUTI_LIVE_WHISPER: 'true'
          CONAUTI_FULL_APP: 'true'
          CONAUTI_TEST_AUDIO: /tmp/conauti-audio.wav
        run: python -m pytest -q tests/test_conauti_open_media_live.py
