name: My Teacher IA - Android (prueba APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'frontend/conauti-ui/**'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/vite.conauti.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'frontend/conauti-ui/**'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/vite.conauti.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK de prueba (no es versión Play)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Compilar My Teacher IA web integrada
        working-directory: frontend
        run: npm run build:conauti
      - name: Verificar versión y dependencias móviles
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run mobile:check
      - name: Generar plataforma nativa Android
        working-directory: mobile
        run: |
          npm run android:init
          npm run android:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android del runner
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Plataformas disponibles:"
          ls "$ANDROID_HOME/platforms" || true
          # El runner incluye SDK; Gradle instala las plataformas que le falten.
          # No instalar el antiguo paquete "tools", retirado del repositorio Android.
      - name: Compilar APK debug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: my-teacher-ia-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
