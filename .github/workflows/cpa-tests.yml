name: My Teacher IA - Prueba CPA y resumen familiar
on:
  push:
    branches:
      - 'codex/cpa-*'
  workflow_dispatch:
jobs:
  experiencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm install --no-save --no-package-lock playwright@1.56.1
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Probar en escritorio y móvil
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/cpa-servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5175/test-support/cpa-test.html >/dev/null && break; sleep 1; done
          node test-support/cpa.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vistas-prueba-cpa
          path: /tmp/cpa-*.png
          if-no-files-found: ignore
